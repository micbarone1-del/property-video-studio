<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stato operativo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5b6570; --line:#e3e6ea; --ok:#1a7f4b; --warn:#b26a00; --bad:#b3261e; --run:#2456c7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b2026; --ink:#e8ebef; --mute:#9aa4af; --line:#2c333b; --ok:#4cc38a; --warn:#e0a03a; --bad:#ff7b72; --run:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card b { display:block; font-size:22px; }
  .card span { color:var(--mute); font-size:12.5px; }
  .sw { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:2px 10px; font-size:12.5px; }
  .on { color:var(--ok); } .off { color:var(--mute); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  th { color:var(--mute); font-weight:600; font-size:12.5px; }
  tr:last-child td { border-bottom:0; }
  .st-done { color:var(--ok); } .st-running,.st-queued { color:var(--run); } .st-awaiting_approval,.st-draft { color:var(--warn); }
  .st-failed,.st-interrupted { color:var(--bad); }
  .bar { height:6px; background:var(--line); border-radius:4px; margin-top:4px; min-width:90px; } .bar i { display:block; height:100%; background:var(--run); border-radius:4px; }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:0 6px; margin:1px 3px 1px 0; }
  .tag.attn { border-color:var(--warn); color:var(--warn); }
  button { font:inherit; padding:3px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .mute { color:var(--mute); font-size:12.5px; }
  .wrap { overflow-x:auto; }
  #err { color:var(--bad); margin:8px 0; }
  a { color:var(--run); text-decoration:none; } a:hover { text-decoration:underline; }
  .rev { margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .scene { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--line); }
  .scene:first-child { border-top:0; }
  .scene video { width:200px; max-width:100%; border-radius:6px; background:#000; }
  .scene .txt { flex:1; min-width:200px; font-size:13px; }
  .choice label { margin-right:10px; cursor:pointer; }
  .ph { display:inline-block; width:96px; margin:0 6px 6px 0; vertical-align:top; font-size:11.5px; line-height:1.25; }
  .ph img { width:96px; height:72px; object-fit:cover; border-radius:5px; display:block; background:var(--line); }
  .ph.ex img { opacity:.45; }
  .ph .why { color:var(--bad); }
  .desc { white-space:pre-wrap; font-size:13px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--mute); }
  .go { background:var(--run); color:#fff; border-color:var(--run); }
  .todo { border:2px solid var(--bad); border-radius:10px; background:var(--card); padding:10px 12px; margin-bottom:14px; }
  .todo.empty { border:1px solid var(--line); }
  .todo .it { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--line); }
  .todo .it:first-of-type { border-top:0; }
  .todo .it .t { flex:1; min-width:220px; font-size:14px; }
  .hl { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .hl .h { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 9px; font-size:13px; border-left-width:5px; }
  .hl .h.ok { border-left-color:var(--ok); } .hl .h.warn { border-left-color:var(--warn); } .hl .h.red { border-left-color:var(--bad); font-weight:600; }
  .kb { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
  .kw.on { background:var(--run); color:#fff; border-color:var(--run); }
  .kg { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
  .kt { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; color:var(--ink); }
  .kt:hover { border-color:var(--run); }
  .kt .kh { font-size:13px; color:var(--mute); } .kt .kv { font-size:24px; font-weight:600; }
  .ks { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:0 0 12px; }
  .ks .kt { padding:6px 8px; } .ks .kt .kv { font-size:17px; } .ks .kt .kh { font-size:12px; }
  .ksh { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; margin:0 0 6px; font-size:13px; color:var(--mute); }
  body.kpi-on main > *:not(h1):not(#kpiview) { display:none; }
  body:not(.kpi-on) #kpiview { display:none; }
</style>
</head>
<body>
<main>
  <h1>Stato operativo <span class="mute" id="upd"></span></h1>
  <input id="q" placeholder="Cerca: id job, numero annuncio o nome (invio)" style="width:100%;padding:8px;margin:0 0 10px;border-radius:8px;border:1px solid var(--line);font:inherit" onkeydown="if(event.key==='Enter'){Q=this.value.trim();load();}">
  <div><button id="kpi-btn" onclick="kpiGo('#kpi')">📈 Indicatori</button></div>
  <div id="err"></div>
  <div id="kpiview"></div>
  <div id="inbox"></div>
  <div id="kpistrip"></div>
  <div class="hl" id="health"></div>
  <div class="cards" id="cards"></div>
  <div class="sw" id="sw"></div>
  <div id="agencies"></div>
  <div class="wrap"><table>
    <thead><tr><th>Job</th><th>Stato</th><th>Automatico</th><th>Costo</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const KEY_NAME = 'pvs_access';
function getKey() { try { return localStorage.getItem(KEY_NAME) || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem(KEY_NAME, k); } catch (e) {} }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: { 'X-Access-Key': getKey() } }, opt || {}));
  if (r.status === 403) {
    const k = prompt('Chiave di accesso:');
    if (k) { setKey(k.trim()); return api(path, opt); }
    throw new Error('chiave mancante');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function setRelease(mode) {
  if (mode === 'auto' && !confirm('Rilascio automatico: i video finiti dei partner vengono consegnati all\'agenzia senza il tuo ok. Confermi?')) return;
  const fd = new FormData(); fd.append('mode', mode);
  try { const r = await fetch('/operator/release-mode', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd }); if (!r.ok) throw new Error('HTTP ' + r.status); load(); }
  catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function rejectJob(id) {
  const note = prompt('Rifiutare questo video? L\'agenzia ricevera\' un messaggio standard (non la tua nota). Nota interna, facoltativa:');
  if (note === null) return;
  const fd = new FormData(); fd.append('note', note);
  try { const r = await fetch('/jobs/' + id + '/reject', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd }); if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 100)); load(); }
  catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function releaseJob(id) {
  if (!confirm('Consegnare questo video all\'agenzia?')) return;
  try { const r = await fetch('/jobs/' + id + '/release', { method: 'POST', headers: { 'X-Access-Key': getKey() } }); if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 100)); load(); }
  catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function reviewDone(id) { try { await api('/jobs/' + id + '/review-done', { method: 'POST', headers: { 'X-Access-Key': getKey() } }); load(); } catch (e) { document.getElementById('err').textContent = e.message; } }
function nameCell(j) {
  const links = [];
  if (j.status === 'done') links.push('<a href="/jobs/' + j.job_id + '/preview" target="_blank">Guarda</a>', '<a href="/jobs/' + j.job_id + '/download" target="_blank">Scarica</a>');
  const open = ((j.stops_detail && j.stops_detail.length) || j.rework_failed || (j.review_pending && j.auto_approved_scenes && j.auto_approved_scenes.length));
  links.push('<a href="#" onclick="toggle(\'' + j.job_id + '\');return false;">' + (open ? 'Rivedi scene' : 'Dettagli') + '</a>');
  links.push('<a href="/?job=' + encodeURIComponent(j.job_id) + '" target="_blank" rel="noopener">Apri nell\'app</a>');
  return '<b>' + esc(j.name || j.job_id) + '</b>' + (j.listing ? ' <span class="tag">annuncio ' + esc(j.listing) + '</span>' : '') + '<div class="mute">' + esc(j.job_id) + ' - ' + esc(j.source || 'manuale') + ' - ' + esc((j.created_at || '').replace('T', ' ').slice(0, 16)) + '</div><div class="mute">' + links.join(' - ') + '</div><div id="rev-' + j.job_id + '"></div>';
}
function rwBlock(j) {
  if (!j.rework_events || !j.rework_events.length) return '';
  return '<div class="mute" style="margin-top:8px"><b>Rework non riusciti (log interno)</b><br>' + j.rework_events.map(e => esc((e.at || '').slice(0, 19).replace('T', ' ') + ' UTC - ' + e.kind + (e.scenes && e.scenes.length ? ' - scene ' + e.scenes.join(', ') : '') + (e.detail ? ' - ' + e.detail : ''))).join('<br>') + '</div>';
}
const KIND = { rejected: 'rifiutata', flagged: 'segnalata', failed: 'clip non generato' };
function sceneBlock(id, s, withChoice) {
  const vid = '<video controls preload="none" src="/jobs/' + id + '/clip/' + s.scene + '/preview"></video>';
  const sug = s.kind === 'flagged' ? 'approve' : 'redo';
  const choice = withChoice ? '<div class="choice"><label><input type="radio" name="c-' + id + '-' + s.scene + '" value="approve"' + (sug === 'approve' ? ' checked' : '') + '> Approva</label><label><input type="radio" name="c-' + id + '-' + s.scene + '" value="redo"' + (sug === 'redo' ? ' checked' : '') + '> Rifai (circa 1,1 EUR)</label></div>' : '';
  return '<div class="scene">' + (s.kind === 'failed' ? '' : vid) + '<div class="txt"><b>Scena ' + (s.scene + 1) + '</b> - ' + esc(KIND[s.kind] || 'approvata dal sistema') + (s.severity && s.severity !== 'none' ? ' (' + esc(s.severity) + ')' : '') + '<div class="mute">' + esc((s.issues || []).join(' | ') || (s.kind ? 'nessun motivo registrato per questo verdetto' : '')) + '</div>' + choice + '</div></div>';
}
let OPEN = {}, LAST = null, INPUT = {};
async function loadInput(id) {
  if (INPUT[id]) { paintRev(id); return; }
  try { INPUT[id] = await api('/operator/job/' + id + '/input'); paintRev(id); }
  catch (e) { INPUT[id] = { error: e.message }; paintRev(id); }
}
function inputBlock(id) {
  const d = INPUT[id]; if (!d) return '<div class="mute">carico input...</div>';
  if (d.error) return '<div class="mute">input non disponibile: ' + esc(d.error) + '</div>';
  const ex = d.excluded_counts || {}, exTxt = Object.keys(ex).map(k => k + ': ' + ex[k]).join(', ');
  let h = '<details open><summary>Input: annuncio e foto</summary>';
  h += d.listing_url ? '<div><a href="' + esc(d.listing_url) + '" target="_blank" rel="noopener">Apri l\'annuncio originale</a></div>' : '<div class="mute">link all\'annuncio non ricevuto</div>';
  h += '<div class="mute">foto trovate: ' + (d.photos_total != null ? d.photos_total : (d.photo_audit || []).length) + (exTxt ? ' - scartate: ' + esc(exTxt) : '') + '</div>';
  h += (d.photo_audit || []).map(a => '<div class="ph' + (a.excluded ? ' ex' : '') + '"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(a.url) + '" onerror="this.style.visibility=\'hidden\'"><div>' + (a.n || '') + '. ' + esc(a.category || '') + (a.render ? ' (render)' : '') + '</div>' + (a.excluded ? '<div class="why">' + esc(a.excluded) + '</div>' : '') + '</div>').join('');
  h += '<details><summary>Testo dell\'annuncio</summary><div class="desc">' + esc(d.description || '') + '</div></details></details>';
  const nsc = (d.scenes || []).length;
  h += '<details open><summary>Output: voce e scene</summary><div class="desc">' + esc(d.narration_text || '(nessuna voce)') + '</div>';
  if (nsc) h += (d.scenes || []).map(sc => '<div class="ph"><img loading="lazy" src="/jobs/' + id + '/image/' + sc.i + '" onerror="this.style.visibility=\'hidden\'"><div>scena ' + (sc.i + 1) + ': ' + esc(sc.category || '') + '</div>' + (d.scene_facts && d.scene_facts[sc.i] ? '<div class="mute">' + esc(d.scene_facts[sc.i]) + '</div>' : '') + '</div>').join('');
  return h + '</details>';
}
function toggle(id) { OPEN[id] = !OPEN[id]; if (OPEN[id]) loadInput(id); else paintRev(id); }
function paintRev(id) {
  const box = document.getElementById('rev-' + id); if (!box || !LAST) return;
  if (!OPEN[id]) { box.innerHTML = ''; return; }
  const j = LAST.jobs.find(x => x.job_id === id); if (!j) return;
  let html = '';
  if (j.stops_detail && j.stops_detail.length && j.status !== 'awaiting_approval') {
    html += j.stops_detail.map(s => sceneBlock(id, s, false)).join('') + '<div class="mute" style="margin-top:6px">Il job non e\' in attesa di te: per rifare una scena usa Rifai questa scena nell\'app principale.</div>';
  } else if (j.stops_detail && j.stops_detail.length) {
    html += j.stops_detail.map(s => sceneBlock(id, s, true)).join('') + '<div style="margin-top:8px"><button class="go" onclick="confirmApproval(\'' + id + '\')">Conferma scelte</button></div>';
  } else if (j.auto_approved && j.auto_approved.length) {
    html += j.auto_approved.map(a => sceneBlock(id, { scene: a.scene, kind: '', severity: a.severity, issues: a.issues }, false)).join('') + '<div class="mute" style="margin-top:6px">Per rifare una di queste scene usa Rifai nell\'app principale.</div>';
  } else { html = '<div class="mute">' + esc(j.message) + '</div>'; }
  box.innerHTML = '<div class="rev">' + html + rwBlock(j) + inputBlock(id) + '</div>';
}
async function confirmApproval(id) {
  const j = LAST.jobs.find(x => x.job_id === id); if (!j) return;
  const approved = [], redo = [];
  j.stops_detail.forEach(s => { const v = document.querySelector('input[name="c-' + id + '-' + s.scene + '"]:checked'); (v && v.value === 'redo' ? redo : approved).push(s.scene); });
  if (redo.length && !confirm('Rifare ' + redo.length + ' scena/e: costo circa ' + (redo.length * 1.1).toFixed(1) + ' EUR. Confermi?')) return;
  const fd = new FormData(); fd.append('approval', JSON.stringify({ approved_scenes: approved, redo_scenes: redo }));
  try {
    const r = await fetch('/jobs/' + id + '/approve', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120));
    OPEN[id] = false; load();
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
function autoCell(j) {
  const t = [];
  if (j.auto_start) t.push('<span class="tag' + (j.auto_start.state === 'refused' ? ' attn' : '') + '" title="' + esc(j.auto_start.reason) + '">avvio: ' + esc(j.auto_start.state) + '</span>');
  if (j.rework_failed) t.push('<span class="tag attn" title="' + esc((j.rework_events || []).map(e => e.kind + ' ' + (e.scenes || []).join(',') + ' ' + (e.detail || '')).join('\n')) + '">rework non riusciti: ' + j.rework_failed + '</span>');
  if (j.auto_reworked) t.push('<span class="tag">rework automatici: ' + j.auto_reworked + '</span>');
  if (j.auto_approved && j.auto_approved.length) {
    const d = j.auto_approved.map(a => 'scena ' + (a.scene + 1) + ' (' + (a.severity || '-') + '): ' + (a.issues || []).join(' | ')).join('\n');
    t.push('<span class="tag' + (j.review_pending ? ' attn' : '') + '" title="' + esc(d) + '">scene approvate dal sistema: ' + j.auto_approved.length + (j.review_pending ? ' - da rivedere' : ' - viste') + '</span>');
    if (j.review_pending) t.push('<button onclick="reviewDone(\'' + j.job_id + '\')">Segna come vista</button>');
  }
  if (j.status === 'done' && j.source === 'relinx') t.push(j.released ? '<span class="tag">consegnato all\'agenzia</span>' : '<span class="tag attn">non ancora consegnato</span><button onclick="releaseJob(\'' + j.job_id + '\')">Consegna all\'agenzia</button><button onclick="rejectJob(\'' + j.job_id + '\')">Rifiuta</button>')
  if (j.agency_pending && j.status === 'done' && j.source === 'relinx' && !j.released) t.push('<span class="tag attn" title="La pronuncia del nome dell\'agenzia non e\' validata: il rilascio automatico e\' fermo">agenzia da validare</span>');
  if (j.status === 'failed' && j.failure_code === 'rejected_by_operator') t.push('<span class="tag attn" title="' + esc(j.operator_note || '') + '">rifiutato da te</span>');
  if (j.stops) t.push('<span class="tag attn">in attesa di te: ' + j.stops + ' scene</span>');
  return t.join('') || '<span class="mute">-</span>';
}
let AG_SIG = '';
function paintAgencies(list) {   // 2026-11-19: new agencies wait here until the operator confirms how the voice says the name
  const box = document.getElementById('agencies');
  const sig = JSON.stringify(list.map(a => [a.agency_id, a.name, a.has_logo]));
  if (sig === AG_SIG) return;   // no redraw while nothing changed: it would wipe what the operator is typing
  AG_SIG = sig;
  box.innerHTML = list.length ? '<div class="rev" style="margin-bottom:14px"><b>Nuove agenzie da validare</b>' + list.map(a =>
    '<div class="scene"><div class="txt"><b>' + esc(a.name) + '</b> <span class="tag' + (a.has_logo ? '' : ' attn') + '">' + (a.has_logo ? 'logo presente' : 'logo mancante: video con la sola etichetta AI') + '</span>' +
    '<div class="mute">Come la voce dice il nome (modificabile):</div>' +
    '<input id="ap-' + a.agency_id + '" value="' + esc(a.proposal) + '" style="width:100%;max-width:420px;padding:6px;border-radius:8px;border:1px solid var(--line);font:inherit">' +
    '<div style="margin-top:6px"><button onclick="listenAgency(\'' + a.agency_id + '\')">Ascolta</button> <button class="go" onclick="confirmAgency(\'' + a.agency_id + '\')">Conferma pronuncia</button></div>' +
    '<audio id="au-' + a.agency_id + '" controls style="display:none;margin-top:6px;width:100%;max-width:420px"></audio>' +
    '<div class="mute">Finche\' non confermi, il rilascio automatico dei video di questa agenzia e\' fermo (puoi sempre consegnare a mano).</div></div></div>').join('') + '</div>' : '';
}
async function listenAgency(id) {
  const fd = new FormData(); fd.append('pronunciation', document.getElementById('ap-' + id).value);
  const au = document.getElementById('au-' + id);
  try {
    const r = await fetch('/operator/agency/' + id + '/listen', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    au.src = URL.createObjectURL(await r.blob()); au.style.display = 'block';
    try { await au.play(); } catch (e) {}
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function confirmAgency(id) {
  const v = document.getElementById('ap-' + id).value.trim(); if (!v) return;
  const fd = new FormData(); fd.append('pronunciation', v); fd.append('confirm', '1');
  try {
    const r = await fetch('/operator/agency/' + id + '/pronunciation', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 100));
    AG_SIG = ''; load();
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
function ago(iso) { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso + 'Z')) / 60000)); return m < 60 ? m + ' min fa' : m < 1440 ? Math.round(m / 60) + ' h fa' : Math.round(m / 1440) + ' g fa'; }
function jumpJob(id) { Q = id; document.getElementById('q').value = id; load(); }
function inboxItem(e, withDone) {
  return '<div class="it"><div class="t"><b>' + esc(e.subject) + '</b> <span class="mute">' + esc(ago(e.at)) + '</span><div class="mute">' + esc(e.text) + '</div>' +
    (e.job_id ? '<a href="#" onclick="jumpJob(\'' + esc(e.job_id) + '\');return false;">Apri il job' + (e.job_name ? ' ' + esc(e.job_name) : '') + '</a>' : '') +
    (e.job_id ? ' <a href="/?job=' + encodeURIComponent(e.job_id) + '" target="_blank" rel="noopener">Apri nell\'app</a>' : '') + '</div>' +
    (withDone ? '<button class="go" onclick="inboxDone(\'' + esc(e.id) + '\')">Fatto</button>' : '') + '</div>';
}
function paintInbox(ib) {
  const box = document.getElementById('inbox'), a = (ib && ib.actions) || [], i = (ib && ib.info) || [];
  let h = a.length ? '<div class="todo"><b style="color:var(--bad)">Da fare (' + a.length + ')</b>' + a.map(e => inboxItem(e, true)).join('') + '</div>'
                   : '<div class="todo empty"><b style="color:var(--ok)">Niente da fare</b> <span class="mute">- ogni avviso che ricevi per mail o notifica compare qui</span></div>';
  if (i.length) h += '<details style="margin:-6px 0 14px"><summary>Informazioni (' + i.length + ')</summary><div class="todo empty">' + i.map(e => inboxItem(e, false)).join('') +
    '<div style="margin-top:6px"><button onclick="inboxInfoDone()">Chiudi tutte le informazioni</button></div></div></details>';
  box.innerHTML = h;
}
async function inboxDone(id) { try { await api('/operator/inbox/' + id + '/done', { method: 'POST' }); load(); } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; } }
async function inboxInfoDone() { try { await api('/operator/inbox-info-done', { method: 'POST' }); load(); } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; } }
function paintHealth(h) {   // 2026-11-23: system health chips (disk, backups, maintenance heartbeat, service, credits, stuck jobs)
  const rows = (h && h.rows) || [];
  document.getElementById('health').innerHTML = rows.map(r => '<span class="h ' + esc(r.status) + '" title="' + esc(r.status) + '"><b>' + esc(r.label) + '</b>: ' + esc(r.value) + '</span>').join('');
}
let FILTER = ''; let Q = '';
function setFilter(f) { FILTER = (FILTER === f ? '' : f); if (LAST) { load(); } }
async function load() {
  try {
    const d = await api('/operator/status' + (Q ? '?q=' + encodeURIComponent(Q) : ''));
    LAST = d;
    document.getElementById('err').textContent = '';
    document.getElementById('upd').textContent = 'aggiornato ' + new Date().toLocaleTimeString('it-IT');
    const pending = d.jobs.filter(j => j.review_pending).length, waiting = d.jobs.filter(j => j.stops || j.needs_operator).length;
    document.getElementById('cards').innerHTML =
      '<div class="card"><b>' + d.active + ' / ' + d.max_active + '</b><span>job in generazione</span></div>' +
      '<div class="card"><b>' + d.spent_24h_eur.toFixed(1) + ' / ' + d.cap_eur.toFixed(0) + ' EUR</b><span>impegnati nelle ultime 24 h / tetto</span></div>' +
      '<div class="card" style="cursor:pointer;' + (FILTER === 'waiting' ? 'outline:2px solid var(--warn)' : '') + '" onclick="setFilter(\'waiting\')" title="Job fermi in attesa di una tua decisione (scene segnalate dal QC o rework esauriti). Clic per vedere solo quelli."><b>' + waiting + '</b><span>job che aspettano te</span></div>' +
      '<div class="card" style="cursor:pointer;' + (FILTER === 'review' ? 'outline:2px solid var(--warn)' : '') + '" onclick="setFilter(\'review\')" title="Job gia andati avanti: il sistema ha approvato scene con difetti lievi, da rivedere con calma. Clic per vedere solo quelli."><b>' + pending + '</b><span>job con scene da rivedere</span></div>' +
      '<div class="card"><b>' + (d.release_mode === 'auto' ? 'automatico' : 'con il tuo ok') + '</b><span>rilascio all\'agenzia</span><br><button onclick="setRelease(\'' + (d.release_mode === 'auto' ? 'manual' : 'auto') + '\')">' + (d.release_mode === 'auto' ? 'Passa a: con il mio ok' : 'Passa a: automatico') + '</button></div>';
    paintInbox(d.inbox);
    paintHealth(d.health);
    paintAgencies(d.agencies_pending || []);
    const s = d.switches, p = (n, v) => '<span class="pill ' + (v ? 'on' : 'off') + '">' + n + ': ' + (v ? 'acceso' : 'spento') + '</span>';
    document.getElementById('sw').innerHTML = p('avvio automatico', s.auto_start) + p('rework automatico', s.auto_rework) + p('approvazione segnalate', s.auto_approve_flags) + p('regola misurata', s.standard_enforce) + '<span class="pill">Luma: ' + esc(s.luma_resolution) + '</span>';
    const shown = FILTER === 'waiting' ? d.jobs.filter(j => j.stops || j.needs_operator) : FILTER === 'review' ? d.jobs.filter(j => j.review_pending) : d.jobs;
    document.getElementById('rows').innerHTML = shown.map(j =>
      '<tr><td>' + nameCell(j) + '</td>' +
      '<td><span class="st-' + esc(j.status) + '">' + esc(j.status) + '</span>' + (j.progress != null ? '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, j.progress)) + '%"></i></div>' : '') + '<div class="mute">' + esc(j.message) + '</div>' + (j.missing_rooms && j.missing_rooms.length ? '<div class="mute" style="color:#b45309">Mancano tra le scene: ' + esc(j.missing_rooms.join(', ')) + '</div>' : '') + '</td>' +
      '<td>' + autoCell(j) + '</td><td>' + (j.cost_eur != null ? j.cost_eur.toFixed(2) + ' EUR' : '<span class="mute">-</span>') + '</td></tr>').join('');
    Object.keys(OPEN).forEach(id => { if (OPEN[id]) paintRev(id); });
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
// ── 2026-11-24: KPI dashboard (tiles with a chart of a value over a time window; click -> list; back). Data: /operator/kpi, /operator/kpi/list ──
/*KPI-PURE-START*/
const KPI_ORDER = ['completed', 'failed', 'gen_time', 'cost_avg', 'rework_pct', 'stuck', 'health'];
const KPI_LIST = { completed: 'completed', failed: 'failed', gen_time: 'gen_time', cost_avg: 'cost', rework_pct: 'rework', stuck: 'stuck' };
const KPI_BARS = { completed: 1, failed: 1 };
const KPI_WINDOWS = [['24h', '24 ore'], ['7d', '7 giorni'], ['30d', '30 giorni']];
function kpiParse(hash) {   // '#kpi' | '#kpi?w=7d' | '#kpi/cost_avg?w=7d&n=20'  ->  {tile, w, n} or null
  const m = /^#kpi(?:\/([a-z_]+))?(?:\?(.*))?$/.exec(hash || '');
  if (!m) return null;
  const q = new URLSearchParams(m[2] || '');
  const w = ['24h', '7d', '30d'].indexOf(q.get('w')) >= 0 ? q.get('w') : '24h';
  let n = parseInt(q.get('n') || '20', 10);
  if (!(n >= 1 && n <= 200)) n = 20;
  return { tile: KPI_ORDER.indexOf(m[1]) >= 0 ? m[1] : null, w: w, n: n };
}
function kpiHash(tile, w, n) { return '#kpi' + (tile ? '/' + tile : '') + '?w=' + w + (tile ? '&n=' + n : ''); }
function kpiNum(v, unit) {
  if (v == null) return '—';
  const t = unit === 'EUR' ? Number(v).toFixed(2) : (Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10));
  return t + (unit ? ' ' + unit : '');
}
function kpiTime(iso, w) {
  const d = new Date(iso + (/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? '' : 'Z'));
  if (isNaN(d)) return '';
  const p = x => String(x).padStart(2, '0');
  return w === '24h' ? p(d.getHours()) + ':' + p(d.getMinutes()) : p(d.getDate()) + '/' + p(d.getMonth() + 1);
}
function kpiChart(points, points2, bars, unit, w) {   // one small SVG: bars (counts) or a line (values, gaps where there is no data); optional 2nd dashed line
  const W = 300, H = 92, L = 4, R = 4, T = 16, B = 16, pw = W - L - R, ph = H - T - B;
  const all = (points || []).concat(points2 || []).map(p => p.v).filter(v => v != null);
  if (!points || !points.length || !all.length) return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%"><text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" fill="currentColor" opacity=".5" font-size="12">nessun dato nella finestra</text></svg>';
  const max = Math.max(unit === '%' ? 100 : 0, Math.max.apply(null, all)) || 1;
  const n = points.length, step = pw / n;
  const X = i => L + step * (i + 0.5), Y = v => T + ph - (v / max) * ph;
  let g = '<line x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '" stroke="currentColor" opacity=".25"/>';
  const esc2 = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (bars) {
    points.forEach((p, i) => { if (p.v) { const h = (p.v / max) * ph; g += '<rect x="' + (L + step * i + step * 0.15) + '" y="' + (T + ph - h) + '" width="' + (step * 0.7) + '" height="' + h + '" fill="var(--run)"><title>' + esc2(kpiTime(p.t, w) + ': ' + p.v) + '</title></rect>'; } });
  } else {
    const line = (pts, dash) => {
      let d = '', pen = false, out = '';
      pts.forEach((p, i) => { if (p.v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1) + ' '; pen = true; });
      out += '<path d="' + d + '" fill="none" stroke="var(--run)" stroke-width="2"' + (dash ? ' stroke-dasharray="4 3" opacity=".7"' : '') + '/>';
      pts.forEach((p, i) => { if (p.v != null) out += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="2.5" fill="var(--run)"><title>' + esc2(kpiTime(p.t, w) + ': ' + kpiNum(p.v, unit)) + '</title></circle>'; });
      return out;
    };
    g += line(points, false) + (points2 && points2.some(p => p.v != null) ? line(points2, true) : '');
  }
  g += '<text x="' + L + '" y="' + (H - 3) + '" font-size="10" fill="currentColor" opacity=".6">' + esc2(kpiTime(points[0].t, w)) + '</text>' +
       '<text x="' + (W - R) + '" y="' + (H - 3) + '" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">' + esc2(kpiTime(points[n - 1].t, w)) + '</text>' +
       '<text x="' + (W - R) + '" y="' + (T - 5) + '" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">' + esc2(kpiNum(max, unit === '%' ? '%' : '')) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">' + g + '</svg>';
}
function kpiValueText(kind, r) {   // the "value" cell of a drill-down row
  if (kind === 'cost') return r.value != null ? Number(r.value).toFixed(2) + ' EUR' : '—';
  if (kind === 'gen_time') return r.value + ' min';
  if (kind === 'rework') return r.value + (r.value === 1 ? ' scena rifatta' : ' scene rifatte');
  if (kind === 'stuck') return 'fermo da ' + r.value + ' min';
  if (kind === 'completed') return r.value != null ? Number(r.value).toFixed(2) + ' EUR' : '';
  return r.value == null ? '' : String(r.value);
}
function kpiStripHtml(d, esc) {   // the preview strip on the main dashboard: the same tiles and the same chart, small, 24 h
  return KPI_ORDER.map(k => {
    const t = d.tiles && d.tiles[k]; if (!t) return '';
    const unit = t.unit || '';
    const val = k === 'health' ? kpiNum(t.total, '%') + ' / ' + kpiNum(t.total2, '%') : kpiNum(t.total, unit);
    return '<div class="kt" onclick="kpiTile(\'' + k + '\')" title="' + esc(t.detail || '') + '"><div class="kh">' + esc(t.label) + '</div><div class="kv">' + esc(val) + '</div>' +
      kpiChart(t.points, t.points2, !!KPI_BARS[k], unit, d.window || '24h') + '</div>';
  }).join('');
}
/*KPI-PURE-END*/
const KPI_TITLES = { completed: 'Video completati', failed: 'Video falliti', gen_time: 'Tempo di generazione (i più lenti tra gli ultimi)', cost_avg: 'Costo per video', rework_pct: 'Job con rework', stuck: 'Job fermi adesso' };
let KPI_TIMER = null;
function kpiGo(h) { location.hash = h; }
function kpiBack(p) { if (p.tile) kpiGo(kpiHash(null, p.w)); else kpiGo(''); }
async function kpiPaintTiles(p) {
  const box = document.getElementById('kpiview');
  box.innerHTML = '<div class="kb"><button onclick="kpiGo(\'\')">← Cruscotto</button> <b>Indicatori</b> ' +
    KPI_WINDOWS.map(x => '<button class="kw' + (x[0] === p.w ? ' on' : '') + '" onclick="kpiGo(kpiHash(null,\'' + x[0] + '\'))">' + x[1] + '</button>').join(' ') + '</div><div id="kpierr" class="mute">carico…</div><div class="kg" id="kpig"></div>';
  try {
    const d = await api('/operator/kpi?window=' + p.w);
    if (kpiParse(location.hash) == null || kpiParse(location.hash).tile) return;
    document.getElementById('kpierr').textContent = (d.approx ? 'Nota: per i video precedenti all\'aggiornamento l\'orario è quello di creazione (approssimato). ' : '') + 'Clic su una tessera per i dettagli.';
    document.getElementById('kpig').innerHTML = KPI_ORDER.map(k => {
      const t = d.tiles[k]; if (!t) return '';
      const unit = t.unit || '';
      const val = k === 'health' ? kpiNum(t.total, '%') + ' / ' + kpiNum(t.total2, '%') : kpiNum(t.total, unit);
      return '<div class="kt" onclick="kpiTile(\'' + k + '\')"><div class="kh">' + esc(t.label) + '</div><div class="kv">' + esc(val) + '</div><div class="mute">' + esc(t.detail || '') + '</div>' +
        kpiChart(t.points, t.points2, !!KPI_BARS[k], unit, p.w) + '</div>';
    }).join('');
  } catch (e) { document.getElementById('kpierr').textContent = 'Errore: ' + e.message; }
}
function kpiTile(k) {
  const p = kpiParse(location.hash) || { w: kpiStripWin(), n: 20 };
  if (k === 'health') { kpiGo(''); setTimeout(function () { const h = document.getElementById('health'); if (h) h.scrollIntoView({ behavior: 'smooth' }); }, 60); return; }
  kpiGo(kpiHash(k, p.w, p.n));
}
async function kpiPaintList(p) {
  const kind = KPI_LIST[p.tile], box = document.getElementById('kpiview');
  box.innerHTML = '<div class="kb"><button onclick="kpiBack(kpiParse(location.hash))">← Indietro</button> <b>' + esc(KPI_TITLES[p.tile] || p.tile) + '</b> ultimi ' +
    '<select onchange="kpiGo(kpiHash(\'' + p.tile + '\',\'' + p.w + '\',this.value))">' + [10, 20, 50, 100].map(n => '<option' + (n === p.n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div><div id="kpierr" class="mute">carico…</div><div class="wrap"><table><thead><tr><th>Quando</th><th>Job</th><th>Valore</th><th></th></tr></thead><tbody id="kpirows"></tbody></table></div>';
  try {
    const d = await api('/operator/kpi/list?kind=' + kind + '&n=' + p.n);
    const cur = kpiParse(location.hash); if (!cur || cur.tile !== p.tile) return;
    document.getElementById('kpierr').textContent = d.rows.length ? '' : 'Nessun job in questa lista.';
    document.getElementById('kpirows').innerHTML = d.rows.map(r =>
      '<tr><td>' + (r.t ? esc(new Date(r.t + 'Z').toLocaleString('it-IT')) + (r.approx ? ' <span class="mute">(approx.)</span>' : '') : '<span class="mute">-</span>') + '</td>' +
      '<td><b>' + esc(r.name || r.job_id) + '</b> <span class="mute">' + esc(String(r.job_id).slice(0, 8)) + '</span></td><td>' + esc(kpiValueText(kind, r)) + '</td>' +
      '<td><a href="/?job=' + encodeURIComponent(r.job_id) + '" target="_blank" rel="noopener">Apri nell\'app</a> · <a href="#" onclick="Q=\'' + esc(r.job_id) + '\';kpiGo(\'\');load();return false">nel cruscotto</a></td></tr>').join('');
  } catch (e) { document.getElementById('kpierr').textContent = 'Errore: ' + e.message; }
}
function kpiStripWin() { let w = ''; try { w = localStorage.getItem('pvs_kpi_strip_w') || ''; } catch (e) {} return ['24h', '7d', '30d'].indexOf(w) >= 0 ? w : '30d'; }
function kpiStripSet(w) { try { localStorage.setItem('pvs_kpi_strip_w', w); } catch (e) {} kpiPaintStrip(); }
async function kpiPaintStrip() {   // 2026-11-24: preview on the main dashboard (24 h); failures stay quiet, the dashboard must never break because of it
  const box = document.getElementById('kpistrip');
  if (!box || document.body.classList.contains('kpi-on')) return;
  try {
    const w = kpiStripWin(); const d = await api('/operator/kpi?window=' + w);
    box.innerHTML = '<div class="ksh"><b>Indicatori</b> ' + KPI_WINDOWS.map(x => '<button class="kw' + (x[0] === w ? ' on' : '') + '" onclick="kpiStripSet(\'' + x[0] + '\')">' + x[1] + '</button>').join(' ') + ' <a href="#kpi?w=' + w + '">tutti gli indicatori e i dettagli →</a></div><div class="ks">' + kpiStripHtml(d, esc) + '</div>';
  } catch (e) { box.innerHTML = ''; }
}
function kpiRoute() {
  const p = kpiParse(location.hash);
  document.body.classList.toggle('kpi-on', !!p);
  clearInterval(KPI_TIMER);
  if (!p) return;
  window.scrollTo(0, 0);
  if (p.tile) { kpiPaintList(p); } else { kpiPaintTiles(p); KPI_TIMER = setInterval(function () { const c = kpiParse(location.hash); if (c && !c.tile) kpiPaintTiles(c); }, 60000); }
}
window.addEventListener('hashchange', function () { kpiRoute(); if (!kpiParse(location.hash)) kpiPaintStrip(); });
kpiRoute();
kpiPaintStrip(); setInterval(kpiPaintStrip, 60000);
load(); setInterval(function () { if (!Object.keys(OPEN).some(function (k) { return OPEN[k]; })) load(); }, 15000);   // 2026-11-09: no refresh while a review form is open (it reset the choices and the video)
</script>
