<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stato operativo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5b6570; --line:#e3e6ea; --ok:#1a7f4b; --warn:#b26a00; --bad:#b3261e; --run:#2456c7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b2026; --ink:#e8ebef; --mute:#9aa4af; --line:#2c333b; --ok:#4cc38a; --warn:#e0a03a; --bad:#ff7b72; --run:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card b { display:block; font-size:22px; }
  .card span { color:var(--mute); font-size:12.5px; }
  .sw { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:2px 10px; font-size:12.5px; }
  .on { color:var(--ok); } .off { color:var(--mute); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  th { color:var(--mute); font-weight:600; font-size:12.5px; }
  tr:last-child td { border-bottom:0; }
  .st-done { color:var(--ok); } .st-running,.st-queued { color:var(--run); } .st-awaiting_approval,.st-draft { color:var(--warn); }
  .st-failed,.st-interrupted { color:var(--bad); }
  .bar { height:6px; background:var(--line); border-radius:4px; margin-top:4px; min-width:90px; } .bar i { display:block; height:100%; background:var(--run); border-radius:4px; }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:0 6px; margin:1px 3px 1px 0; }
  .tag.attn { border-color:var(--warn); color:var(--warn); }
  button { font:inherit; padding:3px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .mute { color:var(--mute); font-size:12.5px; }
  .wrap { overflow-x:auto; }
  #err { color:var(--bad); margin:8px 0; }
  a { color:var(--run); text-decoration:none; } a:hover { text-decoration:underline; }
  .rev { margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .scene { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--line); }
  .scene:first-child { border-top:0; }
  .scene video { width:200px; max-width:100%; border-radius:6px; background:#000; }
  .scene .txt { flex:1; min-width:200px; font-size:13px; }
  .choice label { margin-right:10px; cursor:pointer; }
  .ph { display:inline-block; width:96px; margin:0 6px 6px 0; vertical-align:top; font-size:11.5px; line-height:1.25; }
  .ph img { width:96px; height:72px; object-fit:cover; border-radius:5px; display:block; background:var(--line); }
  .ph.ex img { opacity:.45; }
  .ph .why { color:var(--bad); }
  .desc { white-space:pre-wrap; font-size:13px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--mute); }
  .go { background:var(--run); color:#fff; border-color:var(--run); }
</style>
</head>
<body>
<main>
  <h1>Stato operativo <span class="mute" id="upd"></span></h1>
  <div id="err"></div>
  <div class="cards" id="cards"></div>
  <div class="sw" id="sw"></div>
  <div class="wrap"><table>
    <thead><tr><th>Job</th><th>Stato</th><th>Automatico</th><th>Costo</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const KEY_NAME = 'pvs_access';
function getKey() { try { return localStorage.getItem(KEY_NAME) || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem(KEY_NAME, k); } catch (e) {} }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: { 'X-Access-Key': getKey() } }, opt || {}));
  if (r.status === 403) {
    const k = prompt('Chiave di accesso:');
    if (k) { setKey(k.trim()); return api(path, opt); }
    throw new Error('chiave mancante');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function setRelease(mode) {
  if (mode === 'auto' && !confirm('Rilascio automatico: i video finiti dei partner vengono consegnati all\'agenzia senza il tuo ok. Confermi?')) return;
  const fd = new FormData(); fd.append('mode', mode);
  try { const r = await fetch('/operator/release-mode', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd }); if (!r.ok) throw new Error('HTTP ' + r.status); load(); }
  catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function releaseJob(id) {
  if (!confirm('Consegnare questo video all\'agenzia?')) return;
  try { const r = await fetch('/jobs/' + id + '/release', { method: 'POST', headers: { 'X-Access-Key': getKey() } }); if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 100)); load(); }
  catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
async function reviewDone(id) { try { await api('/jobs/' + id + '/review-done', { method: 'POST', headers: { 'X-Access-Key': getKey() } }); load(); } catch (e) { document.getElementById('err').textContent = e.message; } }
function nameCell(j) {
  const links = [];
  if (j.status === 'done') links.push('<a href="/jobs/' + j.job_id + '/preview" target="_blank">Guarda</a>', '<a href="/jobs/' + j.job_id + '/download" target="_blank">Scarica</a>');
  const open = ((j.stops_detail && j.stops_detail.length) || (j.review_pending && j.auto_approved_scenes && j.auto_approved_scenes.length));
  links.push('<a href="#" onclick="toggle(\'' + j.job_id + '\');return false;">' + (open ? 'Rivedi scene' : 'Dettagli') + '</a>');
  return '<b>' + esc(j.name || j.job_id) + '</b>' + (j.listing ? ' <span class="tag">annuncio ' + esc(j.listing) + '</span>' : '') + '<div class="mute">' + esc(j.job_id) + ' - ' + esc(j.source || 'manuale') + ' - ' + esc((j.created_at || '').replace('T', ' ').slice(0, 16)) + '</div><div class="mute">' + links.join(' - ') + '</div><div id="rev-' + j.job_id + '"></div>';
}
const KIND = { rejected: 'rifiutata', flagged: 'segnalata', failed: 'clip non generato' };
function sceneBlock(id, s, withChoice) {
  const vid = '<video controls preload="none" src="/jobs/' + id + '/clip/' + s.scene + '/preview"></video>';
  const sug = s.kind === 'flagged' ? 'approve' : 'redo';
  const choice = withChoice ? '<div class="choice"><label><input type="radio" name="c-' + id + '-' + s.scene + '" value="approve"' + (sug === 'approve' ? ' checked' : '') + '> Approva</label><label><input type="radio" name="c-' + id + '-' + s.scene + '" value="redo"' + (sug === 'redo' ? ' checked' : '') + '> Rifai (circa 1,1 EUR)</label></div>' : '';
  return '<div class="scene">' + (s.kind === 'failed' ? '' : vid) + '<div class="txt"><b>Scena ' + (s.scene + 1) + '</b> - ' + esc(KIND[s.kind] || 'approvata dal sistema') + (s.severity ? ' (' + esc(s.severity) + ')' : '') + '<div class="mute">' + esc((s.issues || []).join(' | ')) + '</div>' + choice + '</div></div>';
}
let OPEN = {}, LAST = null, INPUT = {};
async function loadInput(id) {
  if (INPUT[id]) { paintRev(id); return; }
  try { INPUT[id] = await api('/operator/job/' + id + '/input'); paintRev(id); }
  catch (e) { INPUT[id] = { error: e.message }; paintRev(id); }
}
function inputBlock(id) {
  const d = INPUT[id]; if (!d) return '<div class="mute">carico input...</div>';
  if (d.error) return '<div class="mute">input non disponibile: ' + esc(d.error) + '</div>';
  const ex = d.excluded_counts || {}, exTxt = Object.keys(ex).map(k => k + ': ' + ex[k]).join(', ');
  let h = '<details open><summary>Input: annuncio e foto</summary>';
  h += d.listing_url ? '<div><a href="' + esc(d.listing_url) + '" target="_blank" rel="noopener">Apri l\'annuncio originale</a></div>' : '<div class="mute">link all\'annuncio non ricevuto</div>';
  h += '<div class="mute">foto trovate: ' + (d.photos_total != null ? d.photos_total : (d.photo_audit || []).length) + (exTxt ? ' - scartate: ' + esc(exTxt) : '') + '</div>';
  h += (d.photo_audit || []).map(a => '<div class="ph' + (a.excluded ? ' ex' : '') + '"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(a.url) + '" onerror="this.style.visibility=\'hidden\'"><div>' + (a.n || '') + '. ' + esc(a.category || '') + (a.render ? ' (render)' : '') + '</div>' + (a.excluded ? '<div class="why">' + esc(a.excluded) + '</div>' : '') + '</div>').join('');
  h += '<details><summary>Testo dell\'annuncio</summary><div class="desc">' + esc(d.description || '') + '</div></details></details>';
  const nsc = (d.scenes || []).length;
  h += '<details open><summary>Output: voce e scene</summary><div class="desc">' + esc(d.narration_text || '(nessuna voce)') + '</div>';
  if (nsc) h += (d.scenes || []).map(sc => '<div class="ph"><img loading="lazy" src="/jobs/' + id + '/image/' + sc.i + '" onerror="this.style.visibility=\'hidden\'"><div>scena ' + (sc.i + 1) + ': ' + esc(sc.category || '') + '</div>' + (d.scene_facts && d.scene_facts[sc.i] ? '<div class="mute">' + esc(d.scene_facts[sc.i]) + '</div>' : '') + '</div>').join('');
  return h + '</details>';
}
function toggle(id) { OPEN[id] = !OPEN[id]; if (OPEN[id]) loadInput(id); else paintRev(id); }
function paintRev(id) {
  const box = document.getElementById('rev-' + id); if (!box || !LAST) return;
  if (!OPEN[id]) { box.innerHTML = ''; return; }
  const j = LAST.jobs.find(x => x.job_id === id); if (!j) return;
  let html = '';
  if (j.stops_detail && j.stops_detail.length) {
    html += j.stops_detail.map(s => sceneBlock(id, s, true)).join('') + '<div style="margin-top:8px"><button class="go" onclick="confirmApproval(\'' + id + '\')">Conferma scelte</button></div>';
  } else if (j.auto_approved && j.auto_approved.length) {
    html += j.auto_approved.map(a => sceneBlock(id, { scene: a.scene, kind: '', severity: a.severity, issues: a.issues }, false)).join('') + '<div class="mute" style="margin-top:6px">Per rifare una di queste scene usa Rifai nell\'app principale.</div>';
  } else { html = '<div class="mute">' + esc(j.message) + '</div>'; }
  box.innerHTML = '<div class="rev">' + html + inputBlock(id) + '</div>';
}
async function confirmApproval(id) {
  const j = LAST.jobs.find(x => x.job_id === id); if (!j) return;
  const approved = [], redo = [];
  j.stops_detail.forEach(s => { const v = document.querySelector('input[name="c-' + id + '-' + s.scene + '"]:checked'); (v && v.value === 'redo' ? redo : approved).push(s.scene); });
  if (redo.length && !confirm('Rifare ' + redo.length + ' scena/e: costo circa ' + (redo.length * 1.1).toFixed(1) + ' EUR. Confermi?')) return;
  const fd = new FormData(); fd.append('approval', JSON.stringify({ approved_scenes: approved, redo_scenes: redo }));
  try {
    const r = await fetch('/jobs/' + id + '/approve', { method: 'POST', headers: { 'X-Access-Key': getKey() }, body: fd });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120));
    OPEN[id] = false; load();
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
function autoCell(j) {
  const t = [];
  if (j.auto_start) t.push('<span class="tag' + (j.auto_start.state === 'refused' ? ' attn' : '') + '" title="' + esc(j.auto_start.reason) + '">avvio: ' + esc(j.auto_start.state) + '</span>');
  if (j.auto_reworked) t.push('<span class="tag">rework automatici: ' + j.auto_reworked + '</span>');
  if (j.auto_approved && j.auto_approved.length) {
    const d = j.auto_approved.map(a => 'scena ' + a.scene + ' (' + (a.severity || '-') + '): ' + (a.issues || []).join(' | ')).join('\n');
    t.push('<span class="tag' + (j.review_pending ? ' attn' : '') + '" title="' + esc(d) + '">scene approvate dal sistema: ' + j.auto_approved.length + (j.review_pending ? ' - da rivedere' : ' - viste') + '</span>');
    if (j.review_pending) t.push('<button onclick="reviewDone(\'' + j.job_id + '\')">Segna come vista</button>');
  }
  if (j.status === 'done' && j.source === 'relinx') t.push(j.released ? '<span class="tag">consegnato all\'agenzia</span>' : '<span class="tag attn">non ancora consegnato</span><button onclick="releaseJob(\'' + j.job_id + '\')">Consegna all\'agenzia</button>');
  if (j.stops) t.push('<span class="tag attn">in attesa di te: ' + j.stops + ' scene</span>');
  return t.join('') || '<span class="mute">-</span>';
}
let FILTER = '';
function setFilter(f) { FILTER = (FILTER === f ? '' : f); if (LAST) { load(); } }
async function load() {
  try {
    const d = await api('/operator/status');
    LAST = d;
    document.getElementById('err').textContent = '';
    document.getElementById('upd').textContent = 'aggiornato ' + new Date().toLocaleTimeString('it-IT');
    const pending = d.jobs.filter(j => j.review_pending).length, waiting = d.jobs.filter(j => j.stops || j.needs_operator).length;
    document.getElementById('cards').innerHTML =
      '<div class="card"><b>' + d.active + ' / ' + d.max_active + '</b><span>job in generazione</span></div>' +
      '<div class="card"><b>' + d.spent_24h_eur.toFixed(1) + ' / ' + d.cap_eur.toFixed(0) + ' EUR</b><span>impegnati nelle ultime 24 h / tetto</span></div>' +
      '<div class="card" style="cursor:pointer;' + (FILTER === 'waiting' ? 'outline:2px solid var(--warn)' : '') + '" onclick="setFilter(\'waiting\')" title="Job fermi in attesa di una tua decisione (scene segnalate dal QC o rework esauriti). Clic per vedere solo quelli."><b>' + waiting + '</b><span>job che aspettano te</span></div>' +
      '<div class="card" style="cursor:pointer;' + (FILTER === 'review' ? 'outline:2px solid var(--warn)' : '') + '" onclick="setFilter(\'review\')" title="Job gia andati avanti: il sistema ha approvato scene con difetti lievi, da rivedere con calma. Clic per vedere solo quelli."><b>' + pending + '</b><span>job con scene da rivedere</span></div>' +
      '<div class="card"><b>' + (d.release_mode === 'auto' ? 'automatico' : 'con il tuo ok') + '</b><span>rilascio all\'agenzia</span><br><button onclick="setRelease(\'' + (d.release_mode === 'auto' ? 'manual' : 'auto') + '\')">' + (d.release_mode === 'auto' ? 'Passa a: con il mio ok' : 'Passa a: automatico') + '</button></div>';
    const s = d.switches, p = (n, v) => '<span class="pill ' + (v ? 'on' : 'off') + '">' + n + ': ' + (v ? 'acceso' : 'spento') + '</span>';
    document.getElementById('sw').innerHTML = p('avvio automatico', s.auto_start) + p('rework automatico', s.auto_rework) + p('approvazione segnalate', s.auto_approve_flags) + p('regola misurata', s.standard_enforce) + '<span class="pill">Luma: ' + esc(s.luma_resolution) + '</span>';
    const shown = FILTER === 'waiting' ? d.jobs.filter(j => j.stops || j.needs_operator) : FILTER === 'review' ? d.jobs.filter(j => j.review_pending) : d.jobs;
    document.getElementById('rows').innerHTML = shown.map(j =>
      '<tr><td>' + nameCell(j) + '</td>' +
      '<td><span class="st-' + esc(j.status) + '">' + esc(j.status) + '</span>' + (j.progress != null ? '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, j.progress)) + '%"></i></div>' : '') + '<div class="mute">' + esc(j.message) + '</div></td>' +
      '<td>' + autoCell(j) + '</td><td>' + (j.cost_eur != null ? j.cost_eur.toFixed(2) + ' EUR' : '<span class="mute">-</span>') + '</td></tr>').join('');
    Object.keys(OPEN).forEach(id => { if (OPEN[id]) paintRev(id); });
  } catch (e) { document.getElementById('err').textContent = 'Errore: ' + e.message; }
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
