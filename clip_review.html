<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giudizio velocita clip</title>
<style>
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f6f7f9;color:#1b1f24}main{max-width:760px;margin:0 auto;padding:14px}
.c{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:10px;margin-bottom:14px}video{width:100%;border-radius:8px;background:#000}
label{margin-right:14px;display:inline-block;padding:6px 0}textarea{width:100%;height:120px;font:13px monospace}h2{font-size:16px;margin:0 0 6px}
@media(prefers-color-scheme:dark){body{background:#111418;color:#e8ebef}.c{background:#1b2026;border-color:#2c333b}}
</style></head><body><main>
<h1>Giudizio velocita clip</h1><p>Guarda ogni clip e scegli. Alla fine copia il riepilogo e incollalo in chat.</p>
<div id="list"></div><h2>Riepilogo da copiare</h2><textarea id="out" readonly></textarea>
</main><script>
const Q=new URLSearchParams(location.search);
const items=(Q.get('items')||'').split(',').filter(Boolean);
if(Q.get('pace')){ paceMode(); }
async function paceMode(){
  const d=await (await fetch('/test-scratch/pace_review.json?'+Date.now())).json();
  document.getElementById('list').innerHTML='<p>Limite di prova: '+d.limit+'. Per ogni clip: prima (originale) e dopo (rallentato in proporzione).</p>'+d.items.map(it=>
    '<div class="c"><h2>'+it.key+' - tuo giudizio: '+it.label+' - picco '+it.peak+' - velocita '+Math.round(it.factor*100)+'%</h2><b>Prima</b><video controls loop muted playsinline preload="none" src="/test-scratch/'+it.prima+'"></video><b>Dopo</b><video controls loop muted playsinline preload="none" src="/test-scratch/'+it.dopo+'"></video><div>'+
    [['lento','Lento'],['giusto','Giusto'],['veloce','Un po\' veloce'],['moltoveloce','Troppo veloce']].map(o=>'<label><input type="radio" name="'+it.key+'" value="'+o[0]+'" onchange="ans[\''+it.key+'\']=this.value;upd2()"> '+o[1]+' (dopo)</label>').join('')+'</div></div>').join('');
  window._pace=d.items;
}
function upd2(){document.getElementById('out').value=(window._pace||[]).map(i=>i.key+' dopo = '+(ans[i.key]||'?')).join('\n');}
const ans={};
function upd(){document.getElementById('out').value=items.map(i=>i+' = '+(ans[i]||'?')).join('\n');}
document.getElementById('list').innerHTML=items.map(it=>{const [j,s]=it.split(':');
 return '<div class="c"><h2>Job '+j+' - scena '+s+'</h2><video id="v-'+it+'" controls loop muted playsinline preload="none" data-src="/jobs/'+encodeURIComponent(j)+'/clip/'+(parseInt(s,10)-1)+'/preview" data-orig="/jobs/'+encodeURIComponent(j)+'/clip/'+(parseInt(s,10)-1)+'"></video><div class="mute" id="m-'+it+'">in attesa di caricamento...</div><div>'+
 [['lento','Lento'],['giusto','Giusto'],['veloce','Un po\' veloce'],['moltoveloce','Troppo veloce']].map(o=>'<label><input type="radio" name="'+it+'" value="'+o[0]+'" onchange="ans[\''+it+'\']=this.value;upd()"> '+o[1]+'</label>').join('')+'</div></div>';}).join('');
upd();
// one clip at a time: the server builds each light copy one by one, ten requests at once made most of them time out
(async function(){
  for(const it of items){
    const v=document.getElementById('v-'+it), m=document.getElementById('m-'+it);
    if(!v) continue;
    m.textContent='caricamento...';
    await new Promise(res=>{
      let done=false; const fin=(txt)=>{ if(done) return; done=true; m.textContent=txt; res(); };
      v.addEventListener('loadeddata',()=>fin(''),{once:true});
      v.addEventListener('error',()=>{ if(!v.dataset.tried){ v.dataset.tried='1'; v.src=v.dataset.orig; v.load(); } else { fin('clip non disponibile'); } });
      setTimeout(()=>fin('lento: premi play per riprovare'),90000);
      v.src=v.dataset.src; v.load();
    });
  }
})();
</script></body></html>
